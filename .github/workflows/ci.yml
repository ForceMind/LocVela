name: foundation
on:
  push:
    branches: [main, "bootstrap/**", "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate unverified baselines
        run: python -m tools.report compatibility/android.unverified.json compatibility/ios.unverified.json
