name: android-alpha
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile, test and lint both independent apps
        run: python tools/android_gradle.py :model:test :controller:assembleDebug :probe:assembleDebug :controller:lintDebug :probe:lintDebug --no-daemon --stacktrace
      - name: Verify APK signatures and alignment
        shell: bash
        run: |
          for apk in apps/android/controller/build/outputs/apk/debug/*.apk probes/android/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
          done
      - name: Package debug artifacts and build evidence
        run: python tools/package_android.py
      - name: Upload installable debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: locvela-android-debug-${{ github.run_number }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            apps/android/model/build/test-results/
            apps/android/controller/build/reports/
            probes/android/build/reports/
          if-no-files-found: warn
          retention-days: 30
