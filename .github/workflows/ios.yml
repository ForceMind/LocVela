name: ios-development
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helper-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned upstream development dependency
        run: python -m pip install -r adapters/ios_pymobiledevice3/requirements.txt
      - name: All host tests (synthetic transport, no device)
        run: python -m unittest discover -s tests -v
      - name: Verify installed upstream API without connecting to a device
        run: python -m tools.check_ios_backend_api
  swift-probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile independent iOS Probe for simulator
        run: xcodebuild -project probes/ios/LocVelaProbe.xcodeproj -scheme LocVelaProbe -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/locvela-probe-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned device target (not installable IPA)
        run: xcodebuild -project probes/ios/LocVelaProbe.xcodeproj -scheme LocVelaProbe -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath /tmp/locvela-probe-device CODE_SIGNING_ALLOWED=NO build
